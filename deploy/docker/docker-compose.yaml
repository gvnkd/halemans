# Halemans contained deployment (milestone 7): postgres + app + worker,
# bootstrapped by a provision config (design_docs/milestone_7.md).
# No nix required — the halemans image (built by GitHub Actions) carries the
# server, worker, schema bootstrap and the GenPassword tool.
#
# Building the app image without nix (Debian 13 + ghcup + vendored IHP):
#   git submodule update --init
#   docker build -f docker/Dockerfile.deps -t halemans-deps .   # rarely; IHP stack
#   docker build -f docker/Dockerfile -t halemans .
#   HALEMANS_IMAGE=halemans:latest docker compose up -d
#
# First-boot setup:
#   cd deploy/docker
#   cp .env.example .env            # fill in the required values
#   cp provision.example.json provision.json
#   docker run --rm ghcr.io/gvnkd/halemans:latest /bin/GenPassword 'your-plaintext-password'
#     # paste the printed hash into provision.json (users.items[].passwordHash)
#   docker compose up -d
#
# Upgrades: docker compose pull && docker compose up -d — pending database
# migrations (/share/db-migrate in the image) are applied automatically by
# /bin/db-migrate on every app/worker/enqueue-pollers start (idempotent,
# advisory-locked against concurrent boots).
#
# The app listens on HALEMANS_PORT (default 8000). The provision config is
# applied on every app/worker boot (idempotent upserts); edit provision.json
# and `docker compose up -d --force-recreate app worker` to re-apply.
#
# Zabbix host groups without hostgroup.get API permission: export the groups
# once from a privileged session (hostgroup.get, output groupid+name), save
# the response as hostgroups.json next to provision.json (see
# hostgroups.example.json — a bare [{"groupid","name"}] array also works),
# keep "hostGroupsFile": "/provision/hostgroups.json" on the zabbix source
# and uncomment the hostgroups volume mounts below. The file REPLACES the
# source's group cache on every boot; drop the key if unused (a missing
# mounted file aborts startup).

name: halemans

x-halemans-env: &halemans-env
  DATABASE_URL: postgresql://halemans:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/halemans
  HALEMANS_PROVISION_CONFIG: /provision/provision.json

x-halemans-image: &halemans-image
  image: ${HALEMANS_IMAGE:-ghcr.io/gvnkd/halemans:latest}

services:
  db:
    # PostgreSQL 18. Upgrading an existing db-data volume from 16 requires
    # pg_upgrade or dump/restore — PG18 refuses to start on a PG16 datadir.
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: halemans
      POSTGRES_USER: halemans
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # PG18+ layout: mount the parent dir so the datadir lives in a
      # versioned subdirectory and future pg_upgrade --link works across
      # the mount boundary (docker-library/postgres#37).
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halemans -d halemans"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Applies the baked schema bundle on an empty database (no-op afterwards).
  db-init:
    <<: *halemans-image
    command: ["/bin/db-init"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://halemans:${POSTGRES_PASSWORD}@db:5432/halemans

  # Seeds the background poller jobs once per deployment.
  enqueue-pollers:
    <<: *halemans-image
    command: ["/bin/sh", "-c", "/bin/db-migrate && exec /bin/EnqueuePollers"]
    restart: "no"
    depends_on:
      db-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      <<: *halemans-env
    volumes:
      - ./provision.json:/provision/provision.json:ro
      # - ./hostgroups.json:/provision/hostgroups.json:ro

  app:
    <<: *halemans-image
    command: ["/bin/sh", "-c", "/bin/db-migrate && exec /bin/RunProdServer"]
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
      enqueue-pollers:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      <<: *halemans-env
      PORT: "8000"
    volumes:
      - ./provision.json:/provision/provision.json:ro
      # - ./hostgroups.json:/provision/hostgroups.json:ro
    ports:
      - "${HALEMANS_PORT:-8000}:8000"

  worker:
    <<: *halemans-image
    command: ["/bin/sh", "-c", "/bin/db-migrate && exec /bin/RunJobs"]
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
      enqueue-pollers:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      <<: *halemans-env
    volumes:
      - ./provision.json:/provision/provision.json:ro
      # - ./hostgroups.json:/provision/hostgroups.json:ro

volumes:
  db-data:
