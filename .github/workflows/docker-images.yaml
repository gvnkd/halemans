name: docker-images

# Builds the halemans image with nix and pushes it to GHCR. End users deploy
# from deploy/docker/ with docker compose only (no nix).
on:
  push:
#    branches: [master]
    tags: ["v*"]
    paths-ignore:
      # Docs/examples never reach the image; deploy/docker/db-init.sh and
      # roles.sql DO (baked in), so they must stay triggering.
      - "**.md"
      - "design_docs/**"
      - ".opencode/**"
      - "deploy/docker/*.example.json"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16

      - uses: cachix/cachix-action@v15
        with:
          name: halemans
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build image
        run: |
          mkdir -p .devenv && printf %s "$PWD" > .devenv/root
          nix --extra-experimental-features 'nix-command flakes' build .#docker-image \
              --impure --override-input devenv-root "file+file://$PWD/.devenv/root" \
              -o image.tar.gz

      - name: Load image
        run: docker load < image.tar.gz

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        run: |
          docker tag halemans:latest "$IMAGE:latest"
          docker tag halemans:latest "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            docker tag "halemans:latest" "$IMAGE:${{ github.ref_name }}"
            docker push "$IMAGE:${{ github.ref_name }}"
          fi
