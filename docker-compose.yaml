# Halemans contained deployment (milestone 7): postgres + app + worker,
# bootstrapped by a provision config (design_docs/milestone_7.md).
#
# First-boot setup:
#   nix build .#docker-image -o result-image && docker load < result-image
#   nix build .#db-init -o deploy/db-init
#   cp deploy/provision.example.json deploy/provision.json
#   nix develop -c halemans-gen-password admin@example.com
#     # paste the printed passwordHash into deploy/provision.json, store the
#     # plaintext in your password manager
#   export POSTGRES_PASSWORD=... IHP_SESSION_SECRET=... HALEMANS_GENERIC_HOOK_TOKEN=...
#   docker compose up -d
#
# The app listens on :8000. The provision config is applied on every app/worker
# boot (idempotent upserts); edit deploy/provision.json and
# `docker compose up -d --force-recreate app worker` to re-apply.

name: halemans

x-halemans-env: &halemans-env
  DATABASE_URL: postgresql://halemans:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/app
  IHP_SESSION_SECRET: ${IHP_SESSION_SECRET:?set IHP_SESSION_SECRET}
  HALEMANS_PROVISION_CONFIG: /provision/provision.json
  # Referenced by deploy/provision.json webhookTokens.tokenEnv; provisioning
  # aborts startup if it is missing.
  HALEMANS_GENERIC_HOOK_TOKEN: ${HALEMANS_GENERIC_HOOK_TOKEN:?set HALEMANS_GENERIC_HOOK_TOKEN}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: halemans
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Only runs on an empty data dir (fresh deploy).
      - ./deploy/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halemans -d app"]
      interval: 5s
      timeout: 3s
      retries: 20

  enqueue-pollers:
    image: halemans:latest
    command: ["/bin/EnqueuePollers"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *halemans-env
    volumes:
      - ./deploy/provision.json:/provision/provision.json:ro

  app:
    image: halemans:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      enqueue-pollers:
        condition: service_completed_successfully
    environment:
      <<: *halemans-env
      PORT: "8000"
    volumes:
      - ./deploy/provision.json:/provision/provision.json:ro
    ports:
      # Host-side port overridable: HALEMANS_PORT=28080 docker compose up -d
      - "${HALEMANS_PORT:-8000}:8000"

  worker:
    image: halemans:latest
    command: ["/bin/RunJobs"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      enqueue-pollers:
        condition: service_completed_successfully
    environment:
      <<: *halemans-env
    volumes:
      - ./deploy/provision.json:/provision/provision.json:ro

volumes:
  db-data:
